name: Windows Remote Test

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:

      - name: Informações do sistema
        shell: pwsh
        run: |
          Write-Host "=== SISTEMA ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "`n=== CPU ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host "`n=== RAM ==="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{
              Name = "RAM_GB"
              Expression = {
                [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
              }
            }

          Write-Host "`n=== GPU ==="
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion

      - name: Instalar Tailscale
        shell: pwsh
        run: |
          Write-Host "Instalando Tailscale..."

          winget install `
            --id Tailscale.Tailscale `
            --exact `
            --accept-package-agreements `
            --accept-source-agreements `
            --silent

      - name: Verificar Tailscale
        shell: pwsh
        run: |
          Start-Sleep -Seconds 10

          $ts = Get-Command tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $ts) {
            Write-Error "Tailscale não foi encontrado."
            exit 1
          }

          tailscale version

      - name: Mostrar rede
        shell: pwsh
        run: |
          Write-Host "=== IPs DA MÁQUINA ==="
          Get-NetIPAddress |
            Where-Object {
              $_.AddressFamily -eq "IPv4"
            } |
            Select-Object InterfaceAlias, IPAddress

          Write-Host "`n=== CONFIGURAÇÃO DE REDE ==="
          ipconfig

      - name: Verificar RDP
        shell: pwsh
        run: |
          Write-Host "=== RDP ==="

          Get-Service TermService |
            Select-Object Name, Status, StartType

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Select-Object DisplayName, Enabled, Direction

      - name: Teste de desempenho
        shell: pwsh
        run: |
          Write-Host "=== DESEMPENHO ==="

          Get-Counter `
            '\Processor(_Total)\% Processor Time' `
            -SampleInterval 2 `
            -MaxSamples 3

      - name: Manter sessão ativa
        shell: pwsh
        run: |
          Write-Host "Runner ativo."

          $minutes = 300

          for ($i = 1; $i -le $minutes; $i++) {
            Write-Host "Minuto $i de $minutes"
            Start-Sleep -Seconds 60
          }
