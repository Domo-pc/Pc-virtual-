name: Windows Gaming PC

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Preparar Windows
        shell: powershell
        run: |
          Write-Host "=== PC WINDOWS INICIADO ==="

          Write-Host "Sistema:"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion

          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host "RAM:"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{Name="RAM_GB";Expression={
              [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
            }}

          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Select-Object Name

      - name: Instalar Tailscale
        shell: powershell
        run: |
          winget install Tailscale.Tailscale `
            --exact `
            --accept-package-agreements `
            --accept-source-agreements `
            --silent

      - name: Verificar Tailscale
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

          $tailscale = Get-Command tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($tailscale) {
            Write-Host "Tailscale instalado."
            tailscale version
          }
          else {
            Write-Error "Tailscale não foi encontrado."
          }

      - name: Informações da máquina
        shell: powershell
        run: |
          Write-Host "=== INFORMAÇÕES DO RUNNER ==="

          hostname

          Write-Host "Interfaces de rede:"
          ipconfig

          Write-Host "=== WORKFLOW ATIVO ==="
          Write-Host "O Windows está sendo executado no GitHub Actions."

      - name: Manter máquina ativa
        shell: powershell
        run: |
          Write-Host "Runner ativo."

          for ($i = 1; $i -le 330; $i++) {
            Write-Host "Tempo restante: $($i) minuto(s)"
            Start-Sleep -Seconds 60
          }
